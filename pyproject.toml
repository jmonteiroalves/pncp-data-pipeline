[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pncp-data-pipeline"
version = "0.1.0"
description = "Batch data pipeline for Brazilian public procurement data (PNCP) with dbt and Gemini enrichment"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jeres Monteiro Alves" }]
keywords = ["data-engineering", "pncp", "gcp", "bigquery", "dbt", "gemini"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "google-cloud-bigquery>=3.25,<4",
  "google-genai>=2.0,<3",
  "google-cloud-storage>=2.16,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "dbt-bigquery>=1.12,<1.13",
  "dbt-core>=1.12,<1.13",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
pncp-pipeline = "pncp_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pncp_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["pncp_pipeline"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
  "integration: tests that call the live PNCP API (set RUN_INTEGRATION=1 to run)",
]

[tool.coverage.run]
source = ["pncp_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
