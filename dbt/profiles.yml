pncp:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'pncp-pipeline-dev') }}"
      dataset: "{{ env_var('DBT_DATASET', 'silver') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      timeout_seconds: 300
      priority: interactive
      job_retries: 1
      maximum_bytes_billed: 10000000000
